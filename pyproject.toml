[project]
# A development harness, not a distribution. It exists so that `uv run` at the
# repository root can drive the whole test suite and the linters across every
# package at once. It is never published, and its lock is never an identity
# source: identity lives in each package's own committed uv.lock (see
# docs/packaging.md).
name = "cruxible-providers-dev"
version = "0.0.0"
description = "Development harness for the cruxible-providers monorepo. Not published."
requires-python = ">=3.11"
dependencies = [
  "cruxible-provider-runtime",
  "cruxible-provider-noop",
  # The plane packages at their BASE install. No extra is named here, and that
  # is the point: the default lane installs no browser, no tensor stack, and no
  # OCR runtime, and the tests that need one are marked `engine` and opted into.
  "cruxible-provider-web",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
cruxible-provider-runtime = { path = "packages/cruxible-provider-runtime", editable = true }
cruxible-provider-noop = { path = "packages/cruxible-provider-noop", editable = true }
cruxible-provider-web = { path = "packages/cruxible-provider-web", editable = true }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
  "packages/cruxible-provider-runtime/tests",
  "packages/cruxible-provider-noop/tests",
  "packages/cruxible-provider-web/tests",
]
# `-m "not engine"` is in the default options rather than left to whoever runs
# the suite. An engine test needs a browser, a tensor stack, or an OCR runtime
# that the base install deliberately does not carry, so the default run must
# exclude them by construction -- a lane that is opt-out is a lane somebody runs
# by accident on a laptop with no engines and reads as broken.
addopts = "-ra --strict-markers --import-mode=importlib -m 'not engine'"
markers = [
  "egress_conformance: runs with outbound sockets blocked; asserts declared == observed",
  "engine: needs a real heavy engine from a per-engine extra; excluded from the default run",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["packages/_template/src", "packages/_template/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  # Assertions are used deliberately in the executor for invariants that a
  # subprocess API guarantees; the conformance suite covers the real checks.
  "B011",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true

# The heavy engines ship no type information, and the base install does not
# carry them at all, so every engine import is unresolvable to a type checker
# running in the default environment. That is a property of the heavy-engine
# split rather than a gap in this code: the engine adapters are the only place
# these names appear, each import sits inside the method that needs it, and each
# failure to import is already a typed refusal.
[[tool.mypy.overrides]]
module = [
  "docling.*",
  "paddleocr.*",
  "playwright.*",
]
ignore_missing_imports = true
