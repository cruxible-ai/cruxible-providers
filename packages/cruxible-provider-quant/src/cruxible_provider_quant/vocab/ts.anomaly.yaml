# DRAFT. RP-0 ships the launch vocabularies as DATA for later core registration.
# Quantitative slots carry the most detailed vocabularies; see calc.reduce for why.
interface_id: ts.anomaly
version: 1
status: draft
description: >-
  Flag anomalous points or intervals in a time series. An anomaly flag is a
  reading and a reading is an artifact: the flag enters a Capture under its
  declared CaptureContract and never becomes world-state truth by itself.
dimensions:
  - name: frequency
    description: sampling cadence of the series
    classes:
      - id: sub_hourly
        description: mean spacing under one hour
      - id: hourly
        description: mean spacing from one hour to under one day
      - id: daily
        description: mean spacing from one day to under one week
      - id: weekly_or_slower
        description: mean spacing of one week or more
      - id: irregular
        description: no stable mean spacing
  - name: series_length
    description: observations available in the series
    classes:
      - id: very_short
        description: fewer than 30 observations
      - id: short
        description: 30 to 199 observations
      - id: medium
        description: 200 to 1999 observations
      - id: long
        description: 2000 or more observations
  - name: series_count
    description: how many series one call covers
    classes:
      - id: single
        description: one series
      - id: few
        description: 2 to 10 series
      - id: many
        description: 11 to 1000 series
      - id: massive
        description: more than 1000 series
  - name: domain_class
    description: the measurement domain of the values
    classes:
      - id: counts
        description: non-negative integers; variance tracks the mean
      - id: rates
        description: ratios or proportions bounded by a denominator
      - id: continuous_bounded
        description: continuous values with hard bounds, such as percentages
      - id: continuous_unbounded
        description: continuous values with no natural bound
      - id: categorical_encoded
        description: categorical states encoded numerically; distance is not meaningful
  - name: seasonality
    description: periodic structure present in the series
    classes:
      - id: none
        description: no periodic structure
      - id: single_period
        description: one dominant period
      - id: multi_period
        description: two or more interacting periods
      - id: unknown
        description: periodic structure not established
  - name: gap_profile
    description: how missing observations are distributed
    classes:
      - id: regular
        description: no material gaps
      - id: sparse_gaps
        description: isolated missing observations
      - id: heavy_gaps
        description: extended runs of missing observations
