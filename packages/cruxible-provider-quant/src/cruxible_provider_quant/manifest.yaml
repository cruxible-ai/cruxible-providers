# Package-side provider manifest for the quantitative plane.
#
# This file is a transcription SOURCE, never authority. A provider is bindable
# only through an accepted providers/<provider-id>.yaml governed artifact whose
# payload transcribes this document; at bind and invoke the runtime recomputes
# this manifest's digest and refuses on any divergence.
#
# The distribution's own sha256 is deliberately absent: an artifact cannot carry
# its own hash. It is pinned by the accepted artifact, and it is what the
# implementation digest consumes.
#
# On the bucket claims below. Every selector names buckets these classical
# baselines actually serve, and the faces left unclaimed are left unclaimed on
# purpose — they are where a later narrow-ML implementation of the same
# interface earns its own track record on the same key. The exclusions are
# recorded in the README with the reason for each.
schema_version: 1
provider_id: cruxible-provider-quant
distribution:
  name: cruxible-provider-quant
  version: 0.1.0
entrypoint_group: cruxible.providers
supported_protocol_majors: [1]
implementations:
  # ---------------------------------------------------------------- calc.reduce
  - interface_id: calc.reduce
    interface_digest: "sha256:148c0044ea289d8014b2223f5bd269248972e6213bca046ed476f426642e586e"
    entrypoint: "cruxible_provider_quant.reduce:Reduce"
    backends: [local_env, container]
    declared_input_buckets:
      - "row_count=small;column_count=*;reduction_kind=*;memory_fit=in_memory"
      - "row_count=medium;column_count=*;reduction_kind=*;memory_fit=in_memory"
    bucket_conformance:
      "row_count=small;column_count=*;reduction_kind=*;memory_fit=in_memory": quant-reduce-small
      "row_count=medium;column_count=*;reduction_kind=*;memory_fit=in_memory": quant-reduce-medium
    declared_endpoints: []
    capture_contract_families:
      - calc.reduce.capture.derived.v1
    deterministic: true
    side_effects: false

