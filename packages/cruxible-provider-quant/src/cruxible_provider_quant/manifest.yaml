# Package-side provider manifest for the quantitative plane.
#
# This file is a transcription SOURCE, never authority. A provider is bindable
# only through an accepted Provider build whose payload transcribes this
# document; at bind and invoke the runtime recomputes this manifest's digest and
# refuses on any divergence.
#
# One row per entrypoint. What each entrypoint serves is declared in
# registration.json (its operations), not here.
#
# The distribution's own sha256 is deliberately absent: an artifact cannot carry
# its own hash. It is pinned by the accepted artifact, and it is what the
# implementation digest consumes.
schema_version: 2
provider_id: cruxible-provider-quant
distribution:
  name: cruxible-provider-quant
  version: 0.3.0
entrypoint_group: cruxible.providers
supported_protocol_majors: [2]
implementations:
  # -------------------------------------------------------------- calc.reduce
  - entrypoint: "cruxible_provider_quant.reduce:Reduce"
    backends: [local_env, container]
    declared_endpoints: []
    deterministic: true

  # --------------------------------------------------------------- ts.anomaly
  - entrypoint: "cruxible_provider_quant.anomaly:Anomaly"
    backends: [local_env, container]
    declared_endpoints: []
    deterministic: true

  # -------------------------------------------------------------- ts.forecast
  - entrypoint: "cruxible_provider_quant.forecast:Forecast"
    backends: [local_env, container]
    declared_endpoints: []
    deterministic: true

  # ---------------------------------------------------------------- stat.test
  - entrypoint: "cruxible_provider_quant.stat_test:StatTest"
    backends: [local_env, container]
    declared_endpoints: []
    deterministic: true

  # --------------------------------------------------------------- score.rank
  - entrypoint: "cruxible_provider_quant.rank:Rank"
    backends: [local_env, container]
    declared_endpoints: []
    deterministic: true

  # ------------------------------------------------------------- match.record
  - entrypoint: "cruxible_provider_quant.linkage:RecordLinkage"
    backends: [local_env, container]
    declared_endpoints: []
    deterministic: true

  # ----------------------------------------------------------- calc.calibrate
  - entrypoint: "cruxible_provider_quant.calibrate:Calibrate"
    backends: [local_env, container]
    declared_endpoints: []
    deterministic: true
