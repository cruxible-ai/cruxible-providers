# Package-side provider manifest for the workspace built-in.
#
# This file is a transcription SOURCE, never authority. The built-in enters an
# instance as an ordinary governed proposal of these exact bytes (G6, seed by
# proposal); at bind and invoke the runtime recomputes this manifest's digest and
# refuses on any divergence.
#
# One row per entrypoint; registration.json declares the operation it serves.
#
# The distribution's own sha256 is deliberately absent: an artifact cannot carry
# its own hash. It is pinned by the accepted artifact, and it is what the
# implementation digest consumes.
schema_version: 2
provider_id: cruxible-provider-workspace
distribution:
  name: cruxible-provider-workspace
  version: 0.3.0
entrypoint_group: cruxible.providers
supported_protocol_majors: [2]
implementations:
  - entrypoint: "cruxible_provider_workspace.file:WorkspaceFile"
    backends: [local_env, container]
    # No engine. The base install is the whole install.
    requires_extras: []
    # RAT-9 PURE, spelled the way the manifest can spell it: zero declared
    # endpoints (the egress-conformance lane asserts observed == declared ==
    # empty in both processes) and deterministic. The operation's effect,
    # `pure`, is declared once, in registration.json.
    declared_endpoints: []
    deterministic: true
