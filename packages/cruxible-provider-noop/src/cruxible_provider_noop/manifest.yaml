# Package-side provider manifest.
#
# This file is a transcription SOURCE, never authority. A provider is bindable
# only through an accepted Provider build whose payload transcribes this
# document; at bind and invoke the runtime recomputes this manifest's digest and
# refuses on any divergence.
#
# One row per entrypoint. What an entrypoint serves is declared in
# registration.json (its operations), not here.
#
# The distribution's own sha256 is deliberately absent: an artifact cannot carry
# its own hash. It is pinned by the accepted artifact, and it is what the
# implementation digest consumes.
schema_version: 2
provider_id: cruxible-provider-noop
distribution:
  name: cruxible-provider-noop
  version: 0.3.0
entrypoint_group: cruxible.providers
supported_protocol_majors: [2]
implementations:
  - entrypoint: "cruxible_provider_noop.provider:NoopEcho"
    backends: [local_env, container]
    # Zero declared endpoints: the reference provider contacts nothing, and the
    # egress-conformance lane asserts observed == declared == empty.
    declared_endpoints: []
    deterministic: true
