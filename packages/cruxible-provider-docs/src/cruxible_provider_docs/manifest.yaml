# Package-side provider manifest for the document plane.
#
# This file is a transcription SOURCE, never authority. A provider is bindable
# only through an accepted Provider build whose payload transcribes this
# document; at bind and invoke the runtime recomputes this manifest's digest and
# refuses on any divergence.
#
# One row per entrypoint. What an entrypoint serves is declared in
# registration.json (its operations), not here.
#
# The distribution's own sha256 is deliberately absent: an artifact cannot carry
# its own hash. It is pinned by the accepted artifact, and it is what the
# implementation digest consumes.
schema_version: 2
provider_id: cruxible-provider-docs
distribution:
  name: cruxible-provider-docs
  version: 0.3.0
entrypoint_group: cruxible.providers
supported_protocol_majors: [2]
implementations:
  # doc.to_markdown
  - entrypoint: "cruxible_provider_docs.to_markdown:DoclingToMarkdown"
    backends: [local_env, container]
    # Docling drags a tensor stack, so it lives behind an extra and this
    # implementation declares it. Already-linear documents are converted by the
    # adapter itself and need none of it -- but an implementation binds ONE
    # environment, so the declaration is the union of what its inputs need, and
    # the cheap path rides in an environment sized for the expensive one.
    requires_extras: [docling]
    # Nothing is contacted. The document arrives in the run input and the engine
    # runs locally; a conversion that reached the network would be fetching
    # something nobody declared.
    declared_endpoints: []
    # Layout models are not bit-stable across runs on all backends, and the
    # honest answer to "will this produce the same Markdown twice" is "usually".
    deterministic: false

  # ocr.extract
  - entrypoint: "cruxible_provider_docs.ocr:PaddleOcrExtract"
    backends: [local_env, container]
    # PaddleOCR rather than Surya, and licensing decides it: PaddleOCR is
    # Apache-2.0, Surya is GPL-3.0-or-later with a revenue-dependent commercial
    # grant. See NOTICE and README for the full note.
    requires_extras: [paddleocr]
    declared_endpoints: []
    # An OCR reading is a model's opinion about marks on a page. Not
    # deterministic, and emphatically not observed.
    deterministic: false
