# A synthetic lock, frozen as a digest-golden fixture.
#
# It is synthetic on purpose. A golden taken over a real dependency set moves
# every time a dependency is bumped, which trains everyone to regenerate goldens
# without reading them. This lock exercises the resolver's interesting cases and
# nothing else: a marker-gated dependency, a package published only as an sdist,
# a package with per-platform wheels, and a dev-only package that must NOT be
# resolved.
version = 1
revision = 3
requires-python = ">=3.11"

[[package]]
name = "sample-provider"
version = "0.4.2"
source = { editable = "." }
dependencies = [
    { name = "leaf-pure" },
    { name = "leaf-native" },
    { name = "leaf-windows-only", marker = "sys_platform == 'win32'" },
    { name = "leaf-sdist-only" },
]

[package.dev-dependencies]
dev = [
    { name = "leaf-dev-only" },
]

[[package]]
name = "leaf-pure"
version = "1.3.0"
source = { registry = "https://pypi.example/simple" }
dependencies = [
    { name = "leaf-transitive" },
]
wheels = [
    { url = "https://pypi.example/files/leaf_pure-1.3.0-py3-none-any.whl", hash = "sha256:1111111111111111111111111111111111111111111111111111111111111111" },
]

[[package]]
name = "leaf-transitive"
version = "0.9.1"
source = { registry = "https://pypi.example/simple" }
wheels = [
    { url = "https://pypi.example/files/leaf_transitive-0.9.1-py3-none-any.whl", hash = "sha256:2222222222222222222222222222222222222222222222222222222222222222" },
]

