[project]
name = "cruxible-provider-runtime"
version = "0.4.0"
description = "The library every Cruxible provider package builds on: manifest, registration and protocol schemas, identity digests, install-time retrieval of locked wheels from pinned indexes, the sealed environment cache, secret delivery, run budgets and egress recording."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Cruxible maintainers" }]
keywords = ["cruxible", "provider", "protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.12,<3",
  "packaging>=24.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/cruxible-ai/cruxible-providers"
Documentation = "https://github.com/cruxible-ai/cruxible-providers/blob/main/packages/cruxible-provider-runtime/README.md"
Source = "https://github.com/cruxible-ai/cruxible-providers/tree/main/packages/cruxible-provider-runtime"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling==1.32.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cruxible_provider_runtime"]
