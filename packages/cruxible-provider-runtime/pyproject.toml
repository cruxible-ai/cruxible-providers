[project]
name = "cruxible-provider-runtime"
version = "0.1.0"
description = "Support library for Cruxible provider packages: manifest and protocol schemas, identity digests, fetch-on-bind resolution, cache integrity, secret delivery, budgets and egress instrumentation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Cruxible maintainers" }]
keywords = ["cruxible", "provider", "protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "packaging>=24.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/cruxible-ai/cruxible-providers"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cruxible_provider_runtime"]
