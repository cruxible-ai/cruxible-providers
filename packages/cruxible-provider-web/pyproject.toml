# The web plane. One distribution, one lock, one identity unit; two
# implementations, of two different interfaces.
#
# The install is LIGHT and has no extras: the adapter logic, the schemas, the
# bucket classifiers, the recorded fixtures, an HTTP client and an extractor.
# Neither implementation needs a heavy engine (web.fetch does not render pages),
# so both bind one environment. `uv run pytest` opens no socket.
[project]
name = "cruxible-provider-web"
version = "0.2.1"
description = "Cruxible provider adapters for the web plane: page retrieval and web search."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Cruxible maintainers" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "cruxible-provider-runtime>=0.2.0",
  # The HTTP client is base, not an extra: it is how both implementations reach
  # anything at all, and it is how egress gets recorded. An adapter that could
  # not make a request would have no adapter logic left to test.
  "httpx>=0.27",
  # Imported directly, not only through httpx: the address-pinned transport
  # supplies its own httpcore network backend, so that a connection opens to the
  # address the private-address guard checked.
  "httpcore>=1.0",
  # Extraction is base too, and deliberately so. The heavy-engine split exists
  # to keep a browser, a tensor stack, and an OCR runtime out of the base
  # install; a pure-Python extractor with an lxml wheel is none of those, and
  # putting it behind an extra would buy a few megabytes at the price of a
  # default conformance lane that never runs a real extraction.
  "trafilatura>=2.0",
]

[project.urls]
Homepage = "https://github.com/cruxible-ai/cruxible-providers"

[project.entry-points."cruxible.providers"]
"web.fetch" = "cruxible_provider_web.fetch:WebFetch"
"search.web" = "cruxible_provider_web.search:SearxngSearch"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[tool.uv.sources]
cruxible-provider-runtime = { path = "../cruxible-provider-runtime", editable = true }

[build-system]
requires = ["hatchling==1.32.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cruxible_provider_web"]

# The package's own lock travels inside the wheel, so an install by name from an
# index resolves exactly what the materialization digest pins, with no checkout.
[tool.hatch.build.targets.wheel.extra-metadata]
"uv.lock" = "uv.lock"
