name: ci

# There is no remote yet. This file is committed anyway because the lanes it
# names ARE the batch's acceptance surface, and a lane that exists only in a
# reviewer's head is a lane that does not run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  UV_VERSION: "0.8.13"
  # The core commit whose registration model the core-parity lane checks every
  # schema-3 registration against: rc/0.5.0's head when the lane was added.
  # The 0.5.0 release cut moves this to the core release tag's commit.
  CORE_COMMIT: "3950f1204ecc6c70c5c26dcf9482e5d07110677f"

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }}
      - name: Run the conformance suite
        # Base deps only, and no engine: `uv sync` installs no per-engine extra
        # and the default options exclude the `engine` marker. A default lane
        # that downloaded a browser and a tensor stack would have given up the
        # whole point of the heavy-engine split.
        # core_parity tests need core's model; the core-parity lane runs them.
        run: uv run --python ${{ matrix.python-version }} pytest -q -m "not engine and not core_parity"

  core-parity:
    name: parity with core's registration model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out core at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: cruxible-ai/cruxible
          ref: ${{ env.CORE_COMMIT }}
          path: core
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - name: Give core's model an interpreter of its own
        # Core's client package carries the models (no daemon, no core server);
        # the runtime is there for the renderers, which write through it.
        run: |
          uv venv "$RUNNER_TEMP/core-venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/core-venv" \
            core/packages/cruxible-client packages/cruxible-provider-runtime
          echo "CRUXIBLE_CORE_PYTHON=$RUNNER_TEMP/core-venv/bin/python" >> "$GITHUB_ENV"
      - name: Hold every schema-3 registration to core's model and law
        # With CI set, a missing CRUXIBLE_CORE_PYTHON fails these tests rather
        # than skipping them, so the lane cannot go green without running them.
        run: uv run pytest -q -m core_parity tests/test_package_registration.py

  engine-collect:
    name: engine lane collects without engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - name: Assert the engine lane is wired up and importable with no engine present
        # Collection, not execution. This is what keeps the opt-in lane from
        # rotting unnoticed: an engine test that stopped importing, or a marker
        # that stopped being registered, fails here on every push, at the cost of
        # collecting a few tests rather than of installing three engines.
        run: uv run pytest -q -m engine --collect-only

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: mypy (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - cruxible-provider-runtime
          - cruxible-provider-noop
          - cruxible-provider-web
          - cruxible-provider-docs
          - cruxible-provider-quant
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - name: Typecheck one package's sources
        run: uv run mypy packages/${{ matrix.package }}/src

  digest-goldens:
    name: digest goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - name: Assert the goldens still hold
        run: uv run pytest packages/cruxible-provider-runtime/tests/test_digests_golden.py -q
      - name: Assert regeneration is a no-op
        # A moved digest golden re-keys every track record pinned to the old
        # value. Regenerating in CI and finding a diff means the preimage moved
        # without anyone saying so.
        run: |
          uv run python scripts/regenerate_digest_goldens.py
          git diff --exit-code -- packages/cruxible-provider-runtime/tests/fixtures/golden

  egress-conformance:
    name: egress conformance (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - name: Assert declared == observed with outbound sockets blocked
        # The guard covers BOTH processes: the executor's interpreter via
        # egress.no_network, and the provider child via the sitecustomize that
        # egress.write_child_guard puts on its import path. Provider code runs in
        # the child, so a guard that reached only the executor was asserting a
        # property about the wrong process.
        #
        # What this lane tests is RECORDING CONFORMANCE (declared == observed),
        # not containment. Containment exists in the cloud backend's default-deny
        # policy alone. A runner-level network sandbox would harden the lane; it
        # would not change which of the two claims is being made.
        run: uv run pytest -q -m egress_conformance

  packaging:
    name: packaging invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - name: Assert each package's lock is current
        run: |
          for package in packages/*/; do
            if [ -f "$package/uv.lock" ]; then
              uv lock --check --directory "$package"
            fi
          done
      - name: Assert every released package whose dependency closure moved has a new version
        # A wheel embeds its lock, so a released version is one environment.
        # "Released" is the PUBLISHABLE set in publish.yml (base or head).
        # No --allow-missing-base: an unresolvable base fails the check rather
        # than reporting green on a comparison that never ran.
        run: |
          uv run python scripts/check_closure_moves_are_versioned.py \
            --base "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
      - name: Report the per-package dependency-closure digests
        run: uv run python scripts/dependency_closure_digests.py

  licenses:
    name: licenses and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - uses: anchore/sbom-action/download-syft@v0
      - name: Assert every package ships Apache-2.0 and a NOTICE
        run: |
          for package in packages/*/; do
            test -f "$package/LICENSE" || { echo "$package has no LICENSE"; exit 1; }
            test -f "$package/NOTICE" || { echo "$package has no NOTICE"; exit 1; }
            grep -q "Apache License" "$package/LICENSE" || {
              echo "$package/LICENSE is not Apache-2.0"; exit 1;
            }
          done
      - name: Produce one SBOM per package
        run: |
          mkdir -p sbom
          for package in packages/*/; do
            name="$(basename "$package")"
            syft scan "dir:$package" -o cyclonedx-json="sbom/$name.cdx.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  engines:
    name: real engines (opt-in)
    # NOT part of the default lane, and deliberately manual. Every job here
    # installs a per-engine extra and, on first use, downloads a browser build or
    # a model; that is minutes and gigabytes per run, against tests whose whole
    # subject is whether a recorded engine response still describes what the
    # engine does. That question is worth asking on a schedule and before a
    # release, not on every push.
    #
    # A recording that has drifted fails HERE and nowhere else, so a red run in
    # this lane means the fixtures are describing an engine that no longer
    # behaves that way -- regenerate the recording and read the diff, rather than
    # relaxing the assertion.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: cruxible-provider-web
            extra: browser
          - package: cruxible-provider-docs
            extra: docling
          - package: cruxible-provider-docs
            extra: paddleocr
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install the plane package with its engine extra
        run: |
          uv venv .engine-venv
          uv pip install --python .engine-venv \
            "packages/${{ matrix.package }}[${{ matrix.extra }}]" \
            packages/cruxible-provider-runtime \
            pytest
      - name: Fetch the browser build, when the extra is a browser
        if: matrix.extra == 'browser'
        run: .engine-venv/bin/python -m playwright install --with-deps chromium
      - name: Run the engine lane for this package
        run: .engine-venv/bin/python -m pytest -m engine packages/${{ matrix.package }}/tests -q
